# Hermès — runtime config. Loaded by hermes.settings.Settings; env vars override.
# Data venue = Binance USDT-M futures: the operator's actual account, carries perps +
# funding for the whole universe, AND the venue the strategies were backtested on
# (Binance klines) so live matches the validated backtest. yaml-driven (EXCHANGE_PRIMARY
# env overrides). The carry (#3) hedge needs spot+perp on one venue — Binance has both.
data_venue: binanceusdm
# Binance USDT-M perp symbols ({COIN}/USDT:USDT). The 4 alts were validated: funding (#2)
# and carry (#3) edges generalise (OOS positive on SUI/ARB/WIF/AVAX), momentum (#1) is
# net-positive (mixed OOS) — added in PAPER to scratch-test the edges live and accumulate
# trades toward the gates. funding_history maps {COIN}/... -> {COIN}USDT.
universe: [BTC/USDT:USDT, ETH/USDT:USDT, SOL/USDT:USDT, AVAX/USDT:USDT, SUI/USDT:USDT, ARB/USDT:USDT, WIF/USDT:USDT]
bankroll_usd: 100
base_currency: USDC

# 4-stage maturity ladder.
stages:
  stage_0_paper:
    venue: paper
    # perp (not spot) so the paper agent can SHORT — mean_reversion_regime shorts at
    # upper extremes and the carry pair needs a short-perp leg; a spot stage silently
    # rejected every SELL, crippling the live test to long-only vs the backtest.
    instruments: perp
    # Paper mode still sizes positions (so we can measure performance).
    # No real money is at risk; cap is conservative to mirror Stage 1 sizing.
    per_trade_risk_cap_pct: 0.5
    # 7-asset universe x 3 sleeves -> raised from 3 so the extra arming converts to
    # trades (and accumulates toward the edge_paper_trades gate) instead of being
    # capped. At 0.5% risk/trade, 6 concurrent positions = ~3% of equity deployed.
    max_open_positions: 6
    daily_loss_kill_pct: 5.0
    advance_when:
      # RESTRUCTURATION 2026-07-02: the old `paper_trades: 200` counted trades from ANY
      # skill — a gate fed by the (now retired) drag skill S1 would have advanced stages
      # on bull-beta noise, which is precisely what the honesty machine exists to prevent.
      # edge_paper_trades counts ONLY closed trades whose skill_id is in the CURRENT
      # allowed_skills slate (TradeJournal.count_closed_by_skills). 40 events from a
      # rare-event book is a multi-year horizon by construction — that is honest, not
      # slow (docs/RESTRUCTURATION_2026-07.md §3).
      edge_paper_trades: 40
      walk_forward_sharpe: 1.0
      max_drawdown_pct: 15.0

  # 2026-07-10: repointed stage_1/2/3 from venue: hyperliquid -> binanceusdm.
  # Config-incoherence audit: the operator holds a BINANCE account (also the
  # data_venue: above, i.e. the venue the strategies were backtested on) but NO
  # Hyperliquid account — these dormant stages would have refused to instantiate
  # on first real advance (HyperliquidExchange requires HL credentials that don't
  # exist) and, before that, traded on a venue that never matched the backtested
  # data. Aligning execution on the account actually held closes that backtest-
  # Binance/execution-Hyperliquid gap. Purely config: the gate is at 2/40 and
  # HERMES_STAGE is manual-only, so nothing live changes at stage_0 (paper).
  stage_1_micro:
    venue: binanceusdm
    instruments: perp        # Binance USDT-M perp — no native BTC/ETH/SOL spot on this venue
    leverage_initial: 1      # 1x = no leverage (perp behaves ~spot economically)
    leverage_max: 1
    per_trade_risk_cap_pct: 0.5
    max_open_positions: 3
    daily_loss_kill_pct: 2.0
    advance_when:
      live_trades: 30
      win_rate_vs_paper_sigma: 1.0
      rule_violations: 0

  stage_2_normal:
    venue: binanceusdm
    instruments: perp        # perps only; still 1x at the "normal" stage
    leverage_initial: 1
    leverage_max: 1
    per_trade_risk_cap_pct: 2.0
    max_open_positions: 5
    daily_loss_kill_pct: 4.0
    advance_when:
      days_since_advance: 60
      sortino: 1.5
      profit_factor: 1.3

  stage_3_perps:
    venue: binanceusdm
    instruments: perp
    leverage_initial: 1
    leverage_max: 2
    per_trade_risk_cap_pct: 2.0
    max_open_positions: 5
    daily_loss_kill_pct: 5.0
    advance_when:
      days_since_advance: 90
      calmar: 2.0
      equity_floor_usd: 250

# Macro blackout (audit 2026-07-10, docs/SYSTEME_AUTONOME.md partie III): the agent
# had NO blackout of any kind around FOMC/CPI/NFP — the exact failure mode that cost
# the operator $12k trading through a live announcement on a manual account. Static
# committed calendar: config/macro_calendar.yaml (real dates from federalreserve.gov
# + bls.gov, sourced + dated in that file's header).
# FIDELITY DECISION (operator, non-negotiable): the live strategies were VALIDATED on
# backtests that INCLUDE news periods — blocking trades at stage_0_paper would
# silently diverge live behaviour from what was validated, before we have any
# evidence the blackout even helps (same class of bug as the maker-fee fidelity
# issue). So stage_0_paper is deliberately ABSENT from enforce_stages below: the gate
# still computes + logs (`macro_blackout_shadow`) + is exposed on
# /dashboard/data.protections.macro_blackout, it just never blocks there. Real money
# stages (1/2/3) hard-block.
macro_blackout:
  enabled: true
  pre_hours: 2
  post_hours: 2
  enforce_stages: [stage_1_micro, stage_2_normal, stage_3_perps]

# Rolling drawdown circuit-breaker (audit 2026-07-10): daily_loss_kill_pct above
# resets every UTC midnight, so it is blind to a SLOW multi-day erosion — a loss of
# 4.9%/day for 10 days never crosses any single day's kill_pct but bleeds ~40% of
# equity before the $5 cold-floor even fires. window_days/kill_pct below protect
# real capital against that erosion the daily kill cannot see.
# Same fidelity decision as macro_blackout above: stage_0_paper SHADOW (log + expose
# on /dashboard/data.protections.rolling_loss_kill, never blocks), real stages
# enforce hard.
rolling_loss_kill:
  enabled: true
  window_days: 30
  kill_pct: 10.0
  enforce_stages: [stage_1_micro, stage_2_normal, stage_3_perps]

sizing:
  # position_size_usd = (equity * risk_pct) / (k * ATR(14) / price)
  atr_window: 14
  atr_k: 2.0
  fractional_kelly: 0.20         # f_kelly multiplier — never full Kelly
  confidence_floor: 0.0          # below this, force HOLD
  per_trade_floor_pct: 0.25      # never size smaller than this in basis points*100
  min_trades_before_trusting_kelly: 100
  correlation_rho: 0.85          # avg correlation of the universe (BTC/ETH/SOL); haircuts
                                 # new correlated positions so book risk doesn't stack
  target_vol_per_bar: 0.01       # vol-targeting reference (per 1h bar); risk budget scales
                                 # down when HAR-RV forecast vol exceeds this, up (bounded) when calm

strategy:
  # OOS-validated selective rule (walk-forward on ~9y, commit 330bc92): trade ONLY
  # the high-conviction momentum tail + range mean-reversion, ONE position per move
  # (consolidation), dropping skills that lose even gross (breakout, pairs).
  # DEFAULT OFF — flip selective_mode to true to run it in paper-forward. Enforced
  # deterministically in risk_manager via hermes.risk.selective.selective_gate.
  selective_mode: true         # PAPER-FORWARD: agent trades the OOS-validated rule (stage_0, no real money)
  # RESTRUCTURATION 2026-07-02 (docs/RESTRUCTURATION_2026-07.md §3, operator-approved):
  # ts_mom_vol_scaled (ex-Strategy #1 momentum) is RETIRED from the slate — the re-audit
  # (research_crypto2/_book.json) measured it as a bull-beta drag: book LOO-Δ Sharpe −0.146
  # (the book more than doubles its Sharpe without it) and joint-null p=0.507 (its own trade
  # basket is indistinguishable from random entry; p post look-ahead gate fix 2026-07-02,
  # was 0.69 pre-fix — verdict unchanged). mean_reversion_regime is a DISTINCT
  # range skill and stays. Strategy #2 = funding_squeeze_continuation — the one real edge
  # (joint-null p=0.0005 post-gatefix, was 0.017; honest magnitudes per the re-audit: per-trade Sharpe ~0.3,
  # OOS-40 ~0.3 — the old "+1.1" headline was the annualized number, do not quote it bare).
  # It self-selects at funding z>=2 so it is exempt from conviction_min automatically.
  # #3 funding_carry_harvest is delta-neutral (the paper book routes it STRUCTURALLY
  # to a short-perp+long-spot pair, never a naked order) so it is safe in the slate.
  allowed_skills: [mean_reversion_regime, funding_squeeze_continuation, funding_carry_harvest]
  conviction_min: 1.0          # floor for conviction-gated skills; the current slate self-selects
                               # at extremes, so no skill is conviction-gated today (see selective.py)
  no_pyramid: true             # one position per symbol at a time (consolidation)
  # DEFAULT OFF (2026-07-01): the fees: block below says "the paper exchange mirrors
  # the taker fee ... under-charging here would open the gates on a fictional edge" —
  # but maker_orders=true silently overrode that and charged perp_maker (~9bps RT)
  # instead of perp_taker (~15bps RT, the cost every offline honesty audit uses) on
  # EVERY selective-mode order, not just carry. No fill-rate model backs the maker
  # assumption (the comment admits "real fill rate measured on testnet" — we aren't on
  # testnet). Flip back to true only once a real measured fill-rate justifies it.
  maker_orders: false
  decision_timeframe: 4h       # the rule is validated on 4h bars (decision loop + skills)
  max_hold_bars: 12            # default time exit = 12x4h ~ 48h (mean_reversion vertical barrier)
  max_hold_bars_by_skill:      # per-strategy horizon overrides (mirror each backtest barrier)
    funding_squeeze_continuation: 24   # Strategy #2 validated on a ~24x4h ~ 96h hold
    funding_carry_harvest: 48          # Strategy #3 delta-neutral carry ~48x4h ~ 8 days

fees:
  # Hyperliquid taker/maker fees in basis points (mid-2026). The paper exchange
  # mirrors the taker fee for the stage's instrument so the measured Sharpe /
  # profit-factor reflect REAL net-of-fee performance — the stage gates depend on
  # these numbers, so under-charging here would open the gates on a fictional edge.
  spot_taker: 7
  spot_maker: 4
  perp_taker: 4.5
  perp_maker: 1.5
  slippage_bps: 3        # paper market-impact assumption (per side)

loops:
  # APScheduler cron specs in Hermès TZ.
  # Decision cadence is aligned to the 1h bars the orchestrator uses: polling every
  # 5 min on a 1h candle produced up to 12 redundant decisions per bar (pure churn
  # + fees) and could not keep up with a ~270s tick × 3 symbols. Hourly removes the
  # overtrading and leaves ample headroom. Stop protection still runs every 30s
  # (stop_watcher), so risk control is unaffected by the slower decision loop.
  market_tick:      "0 */4 * * *"        # main decision loop, every 4h (aligned to 4h bars)
  pulse:            "0 * * * *"           # hourly LLM-free signal/regime snapshot -> activity feed
  per_trade_close:  "event"
  nightly_reflect:  "0 23 * * *"
  weekly_rerank:    "0 22 * * 0"
  monthly_compile:  "0 21 1 * *"

agents:
  # Which LLM role each agent maps to. "secondary" = fast classifier work.
  market_analyst:     secondary
  news_analyst:       secondary
  sentiment_analyst:  secondary
  bull_researcher:    primary
  bear_researcher:    primary
  trader:             primary
  risk_manager:       primary
  portfolio_manager:  primary
  reflector:          primary
  meta_optimizer:     escalation     # falls back to primary if no escalation URL
  reflector_nightly:  primary

trm:
  enabled: true
  state_len: 256                  # 8 channels * 32 bars
  action_len: 4                   # [side, size_bucket, stop_bucket, tp_bucket]
  vocab_size: 160                 # action region (0-95) + state region (96-159); see trm/encoder.py
  pad_id: 0
  ignore_label_id: 0
  hidden_size: 256                # smaller than puzzle defaults — trades are simpler
  num_heads: 4
  expansion: 4
  H_cycles: 3
  L_cycles: 6
  L_layers: 2
  halt_max_steps: 6
  confidence_floor: 0.55

memory:
  vector_collection: hermes_lessons
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  episodic_retention_days: 365
  lessons_top_k: 6

data:
  ohlcv_timeframes: [1m, 5m, 15m, 1h, 4h, 1d]
  ohlcv_limit: 500
  refresh_interval_sec: 60
  news_sources: [cryptopanic, reddit_cc]
