# Static macro-event calendar — high-impact US macro events, 2026-2027.
#
# NO NETWORK CALL AT RUNTIME: this file is committed and read directly by
# src/hermes/risk/macro_blackout.py:load_calendar (pure file read + parse). Refresh
# it periodically — the code (macro_blackout.horizon_warning) emits a visible warning
# once "now" is within 60 days of the calendar's honest coverage horizon.
#
# SOURCES (fetched 2026-07-10, each cross-checked against >=2 independent fetches of
# the LIVE official page):
#   - FOMC decision dates: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#     2027 dates are the Fed's own published "tentative" 2027 schedule (press release
#     2025-09-05): https://www.federalreserve.gov/newsevents/pressreleases/monetary20250905a.htm
#     Decision = 2:00pm ET policy statement on the SECOND day of the two-day meeting.
#   - CPI release dates: https://www.bls.gov/schedule/news_release/cpi.htm (08:30 ET)
#   - Employment Situation (NFP) release dates: https://www.bls.gov/schedule/news_release/empsit.htm
#     (08:30 ET). Verified against the official PER-MONTH schedule pages too
#     (e.g. bls.gov/schedule/2026/02_sched.htm), not just the aggregate table — several
#     2026 NFP dates land on a non-Friday weekday (2026-02-11 is a Wednesday,
#     2026-07-02 is a Thursday) and that is BLS's own published schedule, not a
#     transcription error (2026-02-11: BLS pushed the Jan-2026 release off the usual
#     Friday, consistent with processing-schedule disruption after the 2025 federal
#     shutdown; 2026-07-02: the July 4 federal holiday observed Fri 2026-07-03 pushes
#     the June-2026 release to Thursday).
#
# HONEST HORIZON: BLS has NOT published 2027 CPI/NFP dates as of the 2026-07-10
# retrieval date (their schedule pages stop at December 2026: last CPI 2026-12-10,
# last NFP 2026-12-04). FOMC has published through 2027-12-08 (tentative). A blackout
# calendar is only as good as its WORST-covered event type, so
# macro_blackout.calendar_horizon() computes the horizon as the EARLIEST "last date"
# across the 3 event types (today: 2026-12-04, the NFP horizon) even though FOMC
# coverage runs a year further — do not quote the FOMC horizon as "the" horizon.
retrieved: "2026-07-10"

