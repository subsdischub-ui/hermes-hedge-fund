name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hermes-agent:${{ github.sha }}
            ghcr.io/${{ github.repository }}/hermes-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy redeploy
        if: ${{ secrets.DOKPLOY_URL != '' && secrets.DOKPLOY_COMPOSE_ID != '' }}
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"${{ secrets.DOKPLOY_COMPOSE_ID }}"}'
