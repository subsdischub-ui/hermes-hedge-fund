# Dokploy reads this file at the repo root. Configure these env vars in the
# Dokploy UI (Environment tab):
#   HERMES_DOMAIN_API           (e.g. api.hermes.example.com)
#   DEEPSEEK_API_KEY            (primary brain — DeepSeek V4, OpenAI-compatible)
#   LLM_PRIMARY_BASE_URL / _MODEL / _API_KEY   (the FALLBACK cloud LLM, e.g.
#                               OpenRouter or Groq — used only if DeepSeek is down)
#   ...rest of .env.example
#
# The 'dokploy-network' must be created externally (Dokploy creates it).
# Single self-contained agent (+ redis): no Tailscale sidecar, no Mac dependency.

services:

  # --------- Hermès agent (main service) — single self-contained container -
  # Runs on its own dokploy-network IP and is the Traefik ingress itself. Reaches
  # everything over the internet: Binance (market data + paper/exec), DeepSeek
  # (primary brain), and an independent OpenAI-compatible cloud LLM as fallback.
  # NO Tailscale sidecar, NO Mac dependency — so a host reboot can no longer wedge
  # it. The old inter-container netns coupling (network_mode: service:hermes-ts)
  # was the root cause of the 2026-06-25 outage: Docker restarted the agent before
  # the sidecar was up → "cannot join network of a non running container" → stayed
  # down. depends_on is redis only.
  hermes-agent:
    image: ghcr.io/${GITHUB_REPOSITORY:-you/hermes}/hermes-agent:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hermes-redis: { condition: service_healthy }
    networks: [dokploy-network]
    env_file: .env
    environment:
      HERMES_DATA_DIR: /data
      REDIS_URL: redis://hermes-redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:////data/hermes.db
      VECTOR_DIR: /data/chroma
    volumes:
      - hermes-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Traefik ingress moved HERE (the agent now has its own IP on dokploy-network;
    # it used to live on the sidecar only because the agent shared its netns).
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.hermes-api.rule=Host(`${HERMES_DOMAIN_API}`)
      - traefik.http.routers.hermes-api.entrypoints=websecure
      - traefik.http.routers.hermes-api.tls.certresolver=letsencrypt
      - traefik.http.services.hermes-api.loadbalancer.server.port=8000

  hermes-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - hermes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [dokploy-network]

volumes:
  hermes-data:
  hermes-redis-data:

networks:
  dokploy-network:
    external: true
